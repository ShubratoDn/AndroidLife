# Publishes the project website (site/) to GitHub Pages on every push to main.
# One-time setup: Settings › Pages › Build and deployment › Source: GitHub Actions.
name: Website

on:
  push:
    branches: [main]
    paths: [site/**, docs/screenshots/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Screenshots live once in docs/screenshots (also used by the README)
      - name: Assemble site
        run: |
          mkdir -p site/screenshots
          cp docs/screenshots/*.png site/screenshots/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
