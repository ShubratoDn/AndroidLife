<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>PhoneDeck Files</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2338BDF8' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M8 3 4 7l4 4M4 7h16M16 21l4-4-4-4M20 17H4'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #0B0E14; --panel: #111620; --panel-2: #151B26; --border: #1E293B; --border-2: #2A3445;
  --text: #F1F5F9; --muted: #94A3B8; --dim: #64748B; --hover: #1A2230;
  --accent: #38BDF8; --accent-ink: #062033; --sel: rgba(56, 189, 248, .14);
  --danger: #F87171; --ok: #34D399; --warn: #FBBF24;
  --k-folder: #FBBF24; --k-image: #34D399; --k-video: #F87171; --k-audio: #A78BFA;
  --k-doc: #60A5FA; --k-archive: #F97316; --k-apk: #2DD4BF; --k-file: #94A3B8;
  --shadow: 0 12px 40px rgba(0, 0, 0, .45);
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #F4F6FA; --panel: #FFFFFF; --panel-2: #EEF2F7; --border: #E2E8F0; --border-2: #CBD5E1;
    --text: #0F172A; --muted: #475569; --dim: #94A3B8; --hover: #EEF2F7;
    --accent: #0284C7; --accent-ink: #FFFFFF; --sel: rgba(2, 132, 199, .12);
    --danger: #DC2626; --ok: #059669; --warn: #B45309;
    --k-folder: #D97706; --k-image: #059669; --k-video: #DC2626; --k-audio: #7C3AED;
    --k-doc: #2563EB; --k-archive: #EA580C; --k-apk: #0D9488; --k-file: #64748B;
    --shadow: 0 12px 40px rgba(15, 23, 42, .18);
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; color: inherit; }
button {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  height: 36px; padding: 0 14px; border-radius: 10px; cursor: pointer;
  background: var(--panel-2); border: 1px solid var(--border); white-space: nowrap;
}
button:hover:not(:disabled) { background: var(--hover); border-color: var(--border-2); }
button:disabled { opacity: .45; cursor: default; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
button.primary:hover:not(:disabled) { background: var(--accent); filter: brightness(1.08); }
button.danger { color: var(--danger); }
button.danger.solid { background: var(--danger); border-color: var(--danger); color: #fff; }
button.icon { width: 36px; padding: 0; }
input[type=text], input[type=search], input[type=password], select {
  height: 36px; padding: 0 12px; border-radius: 10px; background: var(--panel-2); border: 1px solid var(--border);
}
.ic { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ic.sm { width: 14px; height: 14px; }
.ic.big { width: 44px; height: 44px; stroke-width: 1.5; }
.ic.fill { fill: currentColor; stroke: none; }

/* Login */
.login { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
.login form {
  width: min(360px, 100%); background: var(--panel); border: 1px solid var(--border); border-radius: 18px;
  padding: 28px 24px; text-align: center; box-shadow: var(--shadow);
}
.login h1 { font-size: 20px; margin: 14px 0 4px; }
.login p { color: var(--muted); margin: 0 0 18px; }
.login input {
  width: 100%; height: 54px; text-align: center; font-size: 28px; letter-spacing: .35em;
  font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
}
.login button { width: 100%; height: 44px; margin-top: 12px; }
.login .error { color: var(--danger); min-height: 20px; margin-top: 10px; }
.logo {
  width: 44px; height: 44px; border-radius: 12px; display: inline-grid; place-items: center;
  background: var(--sel); color: var(--accent); flex: none;
}
.logo .ic { width: 24px; height: 24px; stroke-width: 2.4; }

/* Header */
header.top {
  position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  padding: 10px 20px; background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px); border-bottom: 1px solid var(--border);
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand .logo { width: 36px; height: 36px; border-radius: 10px; }
.brand b { font-size: 17px; }
.brand b span { color: #2DD4BF; }
.brand small { display: block; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.storage { flex: 1; min-width: 160px; max-width: 320px; margin-left: auto; font-size: 12px; color: var(--muted); }
.storage .meter { height: 6px; border-radius: 3px; background: var(--panel-2); overflow: hidden; margin-bottom: 4px; }
.storage .meter i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }

.offline {
  background: color-mix(in srgb, var(--danger) 16%, var(--panel)); color: var(--text);
  border-bottom: 1px solid var(--danger); padding: 8px 20px; font-size: 13px;
}

/* Layout */
.layout { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 20px; padding: 16px 20px 120px; }
nav.side { position: sticky; top: 76px; align-self: start; display: flex; flex-direction: column; gap: 2px; }
.side-label { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); margin: 12px 10px 6px; }
.side-label:first-child { margin-top: 2px; }
.place { justify-content: flex-start; background: transparent; border-color: transparent; height: 38px; color: var(--muted); }
.place span { overflow: hidden; text-overflow: ellipsis; }
.place:hover:not(:disabled) { background: var(--hover); border-color: transparent; color: var(--text); }
.place.on { background: var(--sel); color: var(--accent); font-weight: 600; }

.pathbar { display: flex; align-items: center; gap: 8px; min-width: 0; }
.crumbs { display: flex; align-items: center; gap: 2px; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.crumb { background: transparent; border-color: transparent; height: 32px; padding: 0 8px; color: var(--muted); }
.crumb.cur { color: var(--text); font-weight: 600; }
.crumbs .sep { color: var(--dim); }

.toolbar { display: flex; align-items: center; gap: 8px; margin: 12px 0; flex-wrap: wrap; }
.toolbar input[type=search] { flex: 1; min-width: 140px; max-width: 320px; }
.toggle { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; cursor: pointer; user-select: none; }
.spacer { flex: 1; }

.selbar {
  position: sticky; top: 64px; z-index: 10; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 8px 10px 8px 14px; margin-bottom: 12px; border-radius: 12px;
  background: var(--panel); border: 1px solid var(--accent); box-shadow: var(--shadow);
}
.selbar .count { font-weight: 600; margin-right: auto; }

/* Items */
.items.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.item { position: relative; border-radius: 14px; cursor: pointer; user-select: none; border: 1px solid transparent; }
.grid .item { background: var(--panel); border-color: var(--border); padding: 8px; }
.item:hover { border-color: var(--border-2); }
.item.sel { background: var(--sel); border-color: var(--accent); }
.thumb {
  position: relative; aspect-ratio: 1; border-radius: 10px; background: var(--panel-2);
  display: grid; place-items: center; overflow: hidden;
}
.thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.thumb .badge {
  position: absolute; left: 6px; bottom: 6px; width: 24px; height: 24px; border-radius: 50%;
  background: rgba(0, 0, 0, .6); color: #fff; display: grid; place-items: center;
}
.thumb .badge .ic { width: 10px; height: 10px; margin-left: 2px; }
.item .name { margin-top: 8px; font-size: 13px; word-break: break-word; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.item .meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
.pick {
  position: absolute; top: 12px; left: 12px; width: 24px; height: 24px; padding: 0; border-radius: 7px;
  background: rgba(11, 14, 20, .55); border: 1.5px solid rgba(255, 255, 255, .7); color: transparent;
  opacity: 0; transition: opacity .12s;
}
.item:hover .pick, .item.sel .pick, .items.selecting .pick { opacity: 1; }
.item.sel .pick { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.pick:hover:not(:disabled) { background: rgba(11, 14, 20, .75); border-color: #fff; }
.item.sel .pick:hover:not(:disabled) { background: var(--accent); }
.pick .ic { stroke-width: 3; }
.k-folder { --k: var(--k-folder); } .k-image { --k: var(--k-image); } .k-video { --k: var(--k-video); }
.k-audio { --k: var(--k-audio); } .k-doc { --k: var(--k-doc); } .k-archive { --k: var(--k-archive); }
.k-apk { --k: var(--k-apk); } .k-file { --k: var(--k-file); }
.thumb > .ic { color: var(--k); }
.k-folder .thumb { background: color-mix(in srgb, var(--k-folder) 12%, var(--panel-2)); }

.items.list { display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
.list .item, .list .head {
  display: grid; grid-template-columns: 34px 40px minmax(0, 1fr) 110px 180px; align-items: center; gap: 12px;
  padding: 6px 14px; border-radius: 0; border: 0; border-bottom: 1px solid var(--border);
}
.list .item:last-child { border-bottom: 0; }
.list .item:hover { background: var(--hover); }
.list .item.sel { background: var(--sel); }
.list .head { font-size: 12px; font-weight: 600; color: var(--dim); cursor: default; padding-top: 10px; padding-bottom: 10px; }
.list .pick { position: static; opacity: 1; background: transparent; border-color: var(--border-2); width: 20px; height: 20px; border-radius: 6px; }
.list .item.sel .pick { background: var(--accent); }
.list .thumb { width: 40px; height: 40px; border-radius: 8px; }
.list .thumb .ic.big { width: 22px; height: 22px; stroke-width: 1.8; }
.list .thumb .badge { display: none; }
.list .name { margin: 0; -webkit-line-clamp: 1; }
.list .meta, .list .date { margin: 0; font-size: 13px; color: var(--muted); }
.list .num { text-align: right; }

.empty { text-align: center; color: var(--muted); padding: 64px 16px; border: 1.5px dashed var(--border-2); border-radius: 16px; }
.empty .ic { width: 40px; height: 40px; color: var(--dim); margin-bottom: 10px; stroke-width: 1.5; }
.empty b { display: block; color: var(--text); font-size: 15px; margin-bottom: 4px; }

/* Drop overlay */
.drop {
  position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; pointer-events: none;
  background: color-mix(in srgb, var(--bg) 70%, transparent); backdrop-filter: blur(2px);
}
.drop div {
  padding: 36px 48px; border-radius: 20px; border: 2px dashed var(--accent); background: var(--panel);
  text-align: center; font-size: 16px; box-shadow: var(--shadow);
}
.drop .ic { width: 40px; height: 40px; color: var(--accent); display: block; margin: 0 auto 10px; }

/* Upload queue */
.queue {
  position: fixed; right: 20px; bottom: 20px; z-index: 40; width: min(400px, calc(100vw - 32px));
  background: var(--panel); border: 1px solid var(--border-2); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden;
}
.qhead { display: flex; align-items: center; gap: 8px; padding: 12px 10px 12px 16px; border-bottom: 1px solid var(--border); }
.qhead div { flex: 1; min-width: 0; }
.qhead b { display: block; }
.qhead small { color: var(--muted); }
.qhead button { width: 32px; height: 32px; padding: 0; background: transparent; border-color: transparent; }
.qbar { height: 3px; background: var(--panel-2); }
.qbar i { display: block; height: 100%; background: var(--accent); transition: width .2s; }
.qlist { max-height: 320px; overflow-y: auto; }
.queue.collapsed .qlist { display: none; }
.qrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; padding: 10px 10px 10px 16px; border-bottom: 1px solid var(--border); }
.qrow:last-child { border-bottom: 0; }
.qrow .qname { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.qrow .qinfo { font-size: 12px; color: var(--muted); grid-column: 1; }
.qrow .qinfo.err { color: var(--danger); }
.qrow .qinfo.ok { color: var(--ok); }
.qrow .bar { grid-column: 1; height: 4px; border-radius: 2px; background: var(--panel-2); overflow: hidden; margin: 3px 0 1px; }
.qrow .bar i { display: block; height: 100%; background: var(--accent); }
.qrow button { grid-row: 1 / span 3; grid-column: 2; align-self: center; width: 28px; height: 28px; padding: 0; background: transparent; border-color: transparent; color: var(--muted); }
.qmore { padding: 8px 16px; font-size: 12px; color: var(--muted); }

/* Viewer */
.viewer { position: fixed; inset: 0; z-index: 60; background: rgba(4, 6, 10, .94); display: flex; flex-direction: column; color: #F1F5F9; }
.vbar { display: flex; align-items: center; gap: 10px; padding: 12px 16px; }
.vbar div { flex: 1; min-width: 0; }
.vbar b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vbar small { color: #94A3B8; }
.viewer button { background: rgba(255, 255, 255, .08); border-color: rgba(255, 255, 255, .12); color: #F1F5F9; }
.viewer button:hover:not(:disabled) { background: rgba(255, 255, 255, .16); border-color: rgba(255, 255, 255, .2); }
.vstage { flex: 1; min-height: 0; position: relative; display: grid; place-items: center; padding: 0 64px 24px; }
.vstage img, .vstage video { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 6px; }
.vstage audio { width: min(520px, 100%); }
.vstage .audio { display: grid; justify-items: center; gap: 20px; width: 100%; }
.vstage .audio .ic { width: 80px; height: 80px; color: var(--k-audio); stroke-width: 1.3; }
.vnav { position: absolute; top: 50%; transform: translateY(-50%); width: 44px !important; height: 44px !important; border-radius: 50% !important; }
.vnav.prev { left: 12px; } .vnav.next { right: 12px; }

/* Dialog and toast */
.modal { position: fixed; inset: 0; z-index: 70; background: rgba(0, 0, 0, .5); display: grid; place-items: center; padding: 16px; }
.modal form { width: min(420px, 100%); background: var(--panel); border: 1px solid var(--border-2); border-radius: 18px; padding: 22px; box-shadow: var(--shadow); }
.modal h2 { margin: 0 0 8px; font-size: 17px; word-break: break-word; }
.modal p { margin: 0 0 12px; color: var(--muted); }
.modal input { width: 100%; margin: 6px 0 4px; }
.modal .buttons { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
.toast {
  position: fixed; left: 50%; bottom: 24px; z-index: 80; transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
  background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 500;
  max-width: calc(100vw - 32px); transition: opacity .2s, transform .2s; box-shadow: var(--shadow);
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast.err { background: var(--danger); color: #fff; }

/* Narrow screens (tablets, phones) */
@media (max-width: 820px) {
  header.top { padding: 10px 16px; gap: 10px; }
  .storage { order: 3; max-width: none; flex-basis: 100%; margin: 0; }
  .actions { margin-left: auto; }
  .actions .label { display: none; }
  .actions button { width: 36px; padding: 0; }
  .layout { grid-template-columns: minmax(0, 1fr); padding: 12px 16px 120px; gap: 8px; }
  nav.side { position: static; flex-direction: row; overflow-x: auto; scrollbar-width: none; gap: 6px; }
  .side-label { display: none; }
  .place { flex: none; border: 1px solid var(--border); background: var(--panel); height: 34px; }
  .selbar { top: 110px; }
  .items.grid { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
  .list .item, .list .head { grid-template-columns: 28px 40px minmax(0, 1fr) 80px; gap: 10px; padding: 6px 10px; }
  .list .date { display: none; }
  .vstage { padding: 0 8px 16px; }
  .vnav { top: auto; bottom: 20px; transform: none; }
  .queue { right: 16px; bottom: 16px; }
}
</style>
</head>

  <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
  <symbol id="i-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>

  <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></symbol>

<script>
'use strict';

// ---------------------------------------------------------------------------
// Helpers
// ---------------------------------------------------------------------------

const $ = (s) => document.querySelector(s);
const enc = encodeURIComponent;
const collator = new Intl.Collator(undefined, { numeric: true, sensitivity: 'base' });
const store = {
  get(k, d) { try { const v = localStorage.getItem('pd.' + k); return v === null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('pd.' + k, v); } catch (e) { /* private mode */ } },
};

const KINDS = {
  image: 'jpg jpeg png gif webp bmp heic heif avif',
  video: 'mp4 mkv webm mov 3gp avi m4v ts wmv flv',
  audio: 'mp3 m4a aac ogg opus wav flac amr wma mid',
  doc: 'pdf doc docx xls xlsx ppt pptx txt md csv json xml html htm odt ods rtf log epub',
  archive: 'zip rar 7z tar gz tgz bz2 xz',
  apk: 'apk xapk apks aab',
};
const EXT = {};
for (const [kind, list] of Object.entries(KINDS)) list.split(' ').forEach((e) => { EXT[e] = kind; });
const ICON = { folder: 'folder', image: 'image', video: 'film', audio: 'music', doc: 'doc', archive: 'archive', apk: 'package', file: 'file' };
const MEDIA = new Set(['image', 'video', 'audio']);
const OPEN_IN_TAB = new Set(['pdf', 'txt', 'md', 'log', 'json', 'csv', 'xml']);

const ext = (name) => { const i = name.lastIndexOf('.'); return i > 0 ? name.slice(i + 1).toLowerCase() : ''; };
const kindOf = (item) => item.d ? 'folder' : (EXT[ext(item.n)] || 'file');

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function icon(name, cls) {
  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('class', 'ic' + (cls ? ' ' + cls : ''));
  const use = document.createElementNS(ns, 'use');
  use.setAttribute('href', '#i-' + name);
  svg.appendChild(use);
  return svg;
}

function fmtSize(b) {
  if (b < 1024) return b + ' B';
  const units = ['KB', 'MB', 'GB', 'TB'];
  let v = b / 1024, i = 0;
  while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
  return (v >= 100 ? v.toFixed(0) : v.toFixed(1)) + ' ' + units[i];
}

function fmtDate(ms) {
  const d = new Date(ms);
  const time = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  if (d.toDateString() === new Date().toDateString()) return 'Today ' + time;
  return d.toLocaleDateString([], { year: 'numeric', month: 'short', day: 'numeric' }) + ' ' + time;
}

let toastTimer = 0;
function toast(text, error) {
  const t = $('#toast');
  t.textContent = text;
  t.className = 'toast show' + (error ? ' err' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = 'toast' + (error ? ' err' : ''); }, error ? 5000 : 3000);
}

class AuthError extends Error {}

async function api(url, opts) {
  let r;
  try {
    r = await fetch(url, Object.assign({ credentials: 'same-origin', cache: 'no-store' }, opts));
  } catch (e) {
    $('#offline').hidden = false;
    throw new Error("Can't reach the phone");
  }
  $('#offline').hidden = true;
  let data = {};
  try { data = await r.json(); } catch (e) { /* empty body */ }
  if (r.status === 401) { showLogin(); throw new AuthError(data.error || 'PIN needed'); }
  if (!r.ok) throw new Error(data.error || 'Error ' + r.status);
  return data;
}

const post = (url, body) => api(url, body === undefined
  ? { method: 'POST' }
  : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });

function fail(e) { if (!(e instanceof AuthError)) toast(e.message || String(e), true); }

// ---------------------------------------------------------------------------
// State
// ---------------------------------------------------------------------------

const S = {
  info: null, dir: null, items: [], shown: [], sel: new Set(), anchor: -1,
  view: store.get('view', 'grid'), sort: store.get('sort', 'name'), hidden: store.get('hidden', '0') === '1', filter: '',
};

const join = (name) => S.dir.path.replace(/\/$/, '') + '/' + name;
const fileUrl = (path, dl) => '/api/file?' + (dl ? 'dl=1&' : '') + 'path=' + enc(path);
const thumbUrl = (item, size) => '/api/thumb?path=' + enc(join(item.n)) + '&v=' + item.m + (size ? '&size=' + size : '');
const selectedItems = () => S.items.filter((i) => S.sel.has(i.n));

// ---------------------------------------------------------------------------
// Login and start
// ---------------------------------------------------------------------------

function showLogin(message) {
  $('#app').hidden = true;
  $('#viewer').hidden = true;
  $('#login').hidden = false;
  $('#pinError').textContent = message || '';
  setTimeout(() => $('#pin').focus(), 50);
}

$('#loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const pin = $('#pin').value.replace(/\D/g, '');
  try {
    await post('/api/login', { pin });
    $('#pin').value = '';
    start();
  } catch (err) {
    if (err instanceof AuthError) return;
    $('#pinError').textContent = err.message;
    $('#pin').select();
  }
});

async function start() {
  try {
    S.info = await api('/api/info');
  } catch (e) {
    if (!(e instanceof AuthError)) {
      $('#login').hidden = false;
      $('#pinError').textContent = e.message;
    }
    return;
  }
  $('#login').hidden = true;
  $('#app').hidden = false;
  $('#device').textContent = S.info.device + (S.info.readOnly ? ' · read-only' : '');
  $('#sort').value = S.sort;
  $('#showHidden').checked = S.hidden;
  load(hashPath() || S.info.volumes[0].path);
}

// ---------------------------------------------------------------------------
// Navigation (the folder lives in the URL hash so Back works)
// ---------------------------------------------------------------------------

function hashPath() {
  try { return decodeURIComponent(location.hash.slice(1)); } catch (e) { return ''; }
}

function navigate(path) {
  const hash = '#' + enc(path);
  if (location.hash === hash) load(path); else location.hash = hash;
}

window.addEventListener('hashchange', () => { if (S.info) load(hashPath() || S.info.volumes[0].path); });

async function load(path) {
  let d;
  try {
    d = await api('/api/list?path=' + enc(path));
  } catch (e) {
    fail(e);
    if (!S.dir && !(e instanceof AuthError) && path !== S.info.volumes[0].path) navigate(S.info.volumes[0].path);
    return;
  }
  const moved = !S.dir || S.dir.path !== d.path;
  S.dir = d;
  S.items = d.items;
  if (moved) {
    S.sel.clear();
    S.anchor = -1;
    S.filter = '';
    $('#filter').value = '';
    window.scrollTo(0, 0);
  } else {
    const names = new Set(d.items.map((i) => i.n));
    [...S.sel].forEach((n) => { if (!names.has(n)) S.sel.delete(n); });
  }
  render();
}

let refreshTimer = 0;
function refreshSoon() {
  clearTimeout(refreshTimer);
  refreshTimer = setTimeout(() => { if (S.dir) load(S.dir.path); }, 700);
}

// ---------------------------------------------------------------------------
// Rendering
// ---------------------------------------------------------------------------

function render() {
  renderSide();
  renderCrumbs();
  renderStorage();
  renderList();
  renderSelection();
  const writable = S.dir.writable;
  ['#btnUpload', '#btnUploadDir', '#btnNewDir'].forEach((id) => { $(id).disabled = !writable; });
}

function renderSide() {
  const side = $('#side');
  side.replaceChildren();
  const entries = [];
  S.info.volumes.forEach((v, i) => entries.push({ name: v.name, path: v.path, icon: i === 0 ? 'phone' : 'sd', group: 'Storage' }));
  S.info.places.forEach((p) => entries.push({ name: p.name, path: p.path, icon: p.icon, group: 'Places' }));
  // Highlight the most specific place that contains the open folder
  const here = S.dir.path;
  let best = null;
  entries.forEach((e) => {
    if ((here === e.path || here.startsWith(e.path + '/')) && (!best || e.path.length > best.path.length)) best = e;
  });
  let group = '';
  entries.forEach((e) => {
    if (e.group !== group) { group = e.group; side.appendChild(el('div', 'side-label', group)); }
    const b = el('button', 'place' + (e === best ? ' on' : ''));
    b.append(icon(e.icon), el('span', null, e.name));
    b.title = e.path;
    b.onclick = () => navigate(e.path);
    side.appendChild(b);
  });
}

function renderCrumbs() {
  const c = $('#crumbs');
  c.replaceChildren();
  const d = S.dir;
  const parts = [{ name: d.volume, path: d.root }];
  if (d.path.length > d.root.length) {
    let p = d.root;
    d.path.slice(d.root.length + 1).split('/').forEach((s) => { p += '/' + s; parts.push({ name: s, path: p }); });
  }
  parts.forEach((part, i) => {
    if (i) c.appendChild(icon('right', 'sm sep'));
    const b = el('button', 'crumb' + (i === parts.length - 1 ? ' cur' : ''), part.name);
    b.onclick = () => navigate(part.path);
    c.appendChild(b);
  });
  c.scrollLeft = c.scrollWidth;
  $('#btnUp').disabled = !d.parent;
  document.title = d.name + ' · ' + S.info.device;
}

function renderStorage() {
  const { free, total } = S.dir;
  $('#storageBar').style.width = (total ? Math.round((total - free) * 100 / total) : 0) + '%';
  $('#storageText').textContent = S.dir.volume + ': ' + fmtSize(free) + ' free of ' + fmtSize(total);
}

function renderList() {
  const list = $('#list');
  list.className = 'items ' + S.view;
  list.replaceChildren();
  $('#viewIcon').setAttribute('href', S.view === 'grid' ? '#i-list' : '#i-grid');

  let items = S.items.filter((i) => S.hidden || !i.n.startsWith('.'));
  if (S.filter) {
    const f = S.filter.toLowerCase();
    items = items.filter((i) => i.n.toLowerCase().includes(f));
  }
  const byName = (a, b) => collator.compare(a.n, b.n);
  const cmp = { name: byName, date: (a, b) => b.m - a.m, size: (a, b) => b.s - a.s }[S.sort] || byName;
  items.sort((a, b) => (a.d === b.d ? cmp(a, b) || byName(a, b) : (a.d ? -1 : 1)));
  S.shown = items;

  const empty = $('#empty');
  empty.hidden = items.length > 0;
  list.hidden = items.length === 0;
  if (!items.length) {
    empty.replaceChildren(icon(S.filter ? 'file' : 'folder'),
      el('b', null, S.filter ? 'Nothing matches "' + S.filter + '"' : 'This folder is empty'),
      el('span', null, S.dir.writable && !S.filter ? 'Drag files here to send them to the phone.' : ''));
    return;
  }

  const frag = document.createDocumentFragment();
  if (S.view === 'list') {
    const head = el('div', 'head');
    head.append(el('span'), el('span'), el('span', null, 'Name'), el('span', 'num', 'Size'), el('span', 'date', 'Modified'));
    frag.appendChild(head);
  }
  items.forEach((item, i) => frag.appendChild(itemView(item, i)));
  list.appendChild(frag);
  list.classList.toggle('selecting', S.sel.size > 0);
}

function itemView(item, index) {
  const kind = kindOf(item);
  const v = el('div', 'item k-' + kind + (S.sel.has(item.n) ? ' sel' : ''));
  v.dataset.i = index;
  v.title = item.n;

  const pick = el('button', 'pick');
  pick.type = 'button';
  pick.setAttribute('aria-label', 'Select ' + item.n);
  pick.appendChild(icon('check', 'sm'));
  pick.onclick = (e) => { e.stopPropagation(); toggle(index, e.shiftKey); };

  const thumb = el('div', 'thumb');
  thumb.appendChild(icon(ICON[kind], 'big'));
  if (MEDIA.has(kind)) {
    const img = new Image();
    img.loading = 'lazy';
    img.decoding = 'async';
    img.alt = '';
    img.draggable = false;
    img.onerror = () => img.remove();
    img.src = thumbUrl(item);
    thumb.appendChild(img);
    if (kind === 'video') {
      const badge = el('span', 'badge');
      badge.appendChild(icon('play', 'fill'));
      thumb.appendChild(badge);
    }
  }
  const meta = item.d ? item.s + (item.s === 1 ? ' item' : ' items') : fmtSize(item.s);
  if (S.view === 'grid') {
    v.append(thumb, el('div', 'name', item.n), el('div', 'meta', meta), pick);
  } else {
    v.append(pick, thumb, el('div', 'name', item.n), el('div', 'meta num', meta), el('div', 'date', fmtDate(item.m)));
  }
  v.onclick = (e) => onItemClick(index, e);
  return v;
}

function renderSelection() {
  const items = selectedItems();
  const n = items.length;
  $('#selbar').hidden = n === 0;
  $('#list').classList.toggle('selecting', n > 0);
  document.querySelectorAll('#list .item').forEach((v) => {
    v.classList.toggle('sel', S.sel.has(S.shown[+v.dataset.i].n));
  });
  const all = S.shown.length > 0 && S.shown.every((i) => S.sel.has(i.n));
  $('#btnSelectAll').textContent = all ? 'Select none' : 'Select all';
  if (!n) return;
  const bytes = items.filter((i) => !i.d).reduce((a, i) => a + i.s, 0);
  const folders = items.filter((i) => i.d).length;
  $('#selCount').textContent = n + ' selected' + (bytes ? ' · ' + fmtSize(bytes) : '') + (folders ? ' + ' + folders + (folders === 1 ? ' folder' : ' folders') : '');
  const single = n === 1 && !items[0].d;
  $('#btnDownload').lastChild.textContent = single ? 'Download' : 'Download zip';
  $('#btnSeparate').hidden = n < 2 || folders > 0;
  $('#btnRename').hidden = n !== 1 || !S.dir.writable;
  $('#btnDelete').hidden = !S.dir.writable;
}

// ---------------------------------------------------------------------------
// Selection and opening
// ---------------------------------------------------------------------------

function toggle(index, range) {
  if (range && S.anchor >= 0) return selectRange(S.anchor, index);
  const name = S.shown[index].n;
  if (S.sel.has(name)) S.sel.delete(name); else S.sel.add(name);
  S.anchor = index;
  renderSelection();
}

function selectRange(a, b) {
  for (let i = Math.min(a, b); i <= Math.max(a, b); i++) S.sel.add(S.shown[i].n);
  renderSelection();
}

function selectAll() {
  const all = S.shown.length > 0 && S.shown.every((i) => S.sel.has(i.n));
  S.sel.clear();
  if (!all) S.shown.forEach((i) => S.sel.add(i.n));
  renderSelection();
}

function clearSelection() { S.sel.clear(); S.anchor = -1; renderSelection(); }

function onItemClick(index, e) {
  if (e.shiftKey && S.anchor >= 0) return selectRange(S.anchor, index);
  if (e.ctrlKey || e.metaKey || S.sel.size > 0) return toggle(index);
  openItem(S.shown[index]);
}

function openItem(item) {
  const kind = kindOf(item);
  if (item.d) navigate(join(item.n));
  else if (MEDIA.has(kind)) openViewer(item);
  else if (OPEN_IN_TAB.has(ext(item.n))) window.open(fileUrl(join(item.n)), '_blank', 'noopener');
  else downloadFile(item);
}

// ---------------------------------------------------------------------------
// Viewer (photos, videos, music)
// ---------------------------------------------------------------------------

const V = { list: [], i: 0 };

function openViewer(item) {
  V.list = S.shown.filter((i) => MEDIA.has(kindOf(i)));
  V.i = Math.max(0, V.list.indexOf(item));
  $('#viewer').hidden = false;
  showMedia();
}

function showMedia() {
  const item = V.list[V.i];
  const kind = kindOf(item);
  const stage = $('#vStage');
  stage.replaceChildren();
  const url = fileUrl(join(item.n));
  if (kind === 'image') {
    const img = new Image();
    img.alt = item.n;
    // Large previews are made on the phone (fast, and works for HEIC); GIFs keep their animation
    if (ext(item.n) === 'gif') img.src = url;
    else {
      img.onerror = () => { if (!img.dataset.full) { img.dataset.full = '1'; img.src = url; } };
      img.src = thumbUrl(item, 1600);
    }
    stage.appendChild(img);
  } else if (kind === 'video') {
    const video = el('video');
    video.controls = true;
    video.autoplay = true;
    video.playsInline = true;
    video.src = url;
    video.onerror = () => toast("This browser can't play this video. Download it instead.", true);
    stage.appendChild(video);
  } else {
    const box = el('div', 'audio');
    const audio = el('audio');
    audio.controls = true;
    audio.autoplay = true;
    audio.src = url;
    box.append(icon('music'), audio);
    stage.appendChild(box);
  }
  $('#vName').textContent = item.n;
  $('#vMeta').textContent = (V.i + 1) + ' of ' + V.list.length + ' · ' + fmtSize(item.s) + ' · ' + fmtDate(item.m);
  $('#vPrev').disabled = V.i === 0;
  $('#vNext').disabled = V.i === V.list.length - 1;
}

function stepMedia(delta) {
  const next = V.i + delta;
  if (next < 0 || next >= V.list.length) return;
  V.i = next;
  showMedia();
}

function closeViewer() {
  $('#vStage').replaceChildren();
  $('#viewer').hidden = true;
}

$('#vPrev').onclick = () => stepMedia(-1);
$('#vNext').onclick = () => stepMedia(1);
$('#vClose').onclick = closeViewer;
$('#vDownload').onclick = () => downloadFile(V.list[V.i]);
$('#vStage').onclick = (e) => { if (e.target.id === 'vStage') closeViewer(); };

// ---------------------------------------------------------------------------
// Downloads
// ---------------------------------------------------------------------------

function downloadFile(item) {
  const a = el('a');
  a.href = fileUrl(join(item.n), true);
  a.download = item.n;
  document.body.appendChild(a);
  a.click();
  a.remove();
}

function downloadZip(names) {
  const form = el('form');
  form.method = 'POST';
  form.action = '/api/zip';
  form.target = 'dlframe';
  const field = (name, value) => { const i = el('input'); i.type = 'hidden'; i.name = name; i.value = value; form.appendChild(i); };
  field('path', S.dir.path);
  names.forEach((n) => field('name', n));
  document.body.appendChild(form);
  form.submit();
  form.remove();
  toast('Preparing the zip. The download starts in a moment.');
}

$('#btnDownload').onclick = () => {
  const items = selectedItems();
  if (items.length === 1 && !items[0].d) downloadFile(items[0]);
  else downloadZip(items.map((i) => i.n));
};

$('#btnSeparate').onclick = () => {
  // Browsers may ask once to allow several downloads from this page
  selectedItems().filter((i) => !i.d).forEach((item, k) => setTimeout(() => downloadFile(item), k * 400));
};

// ---------------------------------------------------------------------------
// Dialog
// ---------------------------------------------------------------------------

function dialog({ title, text, value, ok = 'OK', danger = false, selectBase = false }) {
  return new Promise((resolve) => {
    const modal = $('#dialog');
    const input = $('#dInput');
    const okButton = $('#dOk');
    $('#dTitle').textContent = title;
    $('#dText').textContent = text || '';
    $('#dText').hidden = !text;
    input.hidden = value == null;
    if (value != null) input.value = value;
    okButton.textContent = ok;
    okButton.className = danger ? 'danger solid' : 'primary';
    modal.hidden = false;
    setTimeout(() => {
      if (value == null) { okButton.focus(); return; }
      input.focus();
      const dot = value.lastIndexOf('.');
      input.setSelectionRange(0, selectBase && dot > 0 ? dot : value.length);
    }, 30);
    const done = (result) => {
      modal.hidden = true;
      $('#dForm').onsubmit = null;
      $('#dCancel').onclick = null;
      modal.onclick = null;
      resolve(result);
    };
    $('#dForm').onsubmit = (e) => { e.preventDefault(); done(value == null ? true : input.value.trim()); };
    $('#dCancel').onclick = () => done(null);
    modal.onclick = (e) => { if (e.target === modal) done(null); };
  });
}

// ---------------------------------------------------------------------------
// Changes: new folder, rename, delete
// ---------------------------------------------------------------------------

function canWrite() {
  if (S.dir && S.dir.writable) return true;
  toast(S.info.readOnly ? 'Read-only mode is on. Turn it off on the phone to make changes.' : "Android doesn't allow changes in this folder", true);
  return false;
}

$('#btnNewDir').onclick = async () => {
  if (!canWrite()) return;
  const name = await dialog({ title: 'New folder', value: 'New folder', ok: 'Create' });
  if (!name) return;
  try {
    await post('/api/mkdir?path=' + enc(S.dir.path) + '&name=' + enc(name));
    await load(S.dir.path);
  } catch (e) { fail(e); }
};

async function renameSelected() {
  const item = selectedItems()[0];
  if (!item || !canWrite()) return;
  const name = await dialog({ title: 'Rename', value: item.n, ok: 'Rename', selectBase: !item.d });
  if (!name || name === item.n) return;
  try {
    await post('/api/rename?path=' + enc(join(item.n)) + '&name=' + enc(name));
    S.sel.clear();
    S.sel.add(name);
    await load(S.dir.path);
  } catch (e) { fail(e); }
}

async function deleteSelected() {
  const items = selectedItems();
  if (!items.length || !canWrite()) return;
  const folders = items.some((i) => i.d);
  const what = items.length === 1 ? '"' + items[0].n + '"' : items.length + ' items';
  const ok = await dialog({
    title: 'Delete ' + what + '?',
    text: 'They are removed from the phone for good' + (folders ? ', including everything inside the folders.' : '.'),
    ok: 'Delete', danger: true,
  });
  if (!ok) return;
  try {
    const r = await post('/api/delete', { paths: items.map((i) => join(i.n)) });
    if (r.failed && r.failed.length) toast("Couldn't delete: " + r.failed.join(', '), true);
    else toast(items.length === 1 ? 'Deleted' : items.length + ' items deleted');
    S.sel.clear();
    await load(S.dir.path);
  } catch (e) { fail(e); }
}

$('#btnRename').onclick = renameSelected;
$('#btnDelete').onclick = deleteSelected;
$('#btnClear').onclick = clearSelection;
$('#btnSelectAll').onclick = selectAll;

// ---------------------------------------------------------------------------
// Uploads: a queue with two files in flight, each streamed straight to storage
// ---------------------------------------------------------------------------

const Q = { jobs: [], active: 0, max: 2, collapsed: false };

function enqueue(files, dir) {
  if (!files.length) return;
  if (!canWrite()) return;
  const total = files.reduce((a, f) => a + f.file.size, 0);
  if (S.dir && dir === S.dir.path && total > S.dir.free) {
    toast('Not enough space on the phone: ' + fmtSize(total) + ' needed, ' + fmtSize(S.dir.free) + ' free', true);
    return;
  }
  files.forEach((f) => Q.jobs.push({ file: f.file, name: f.rel, dir, loaded: 0, status: 'wait', error: '', reported: false }));
  pump();
}

function pump() {
  while (Q.active < Q.max) {
    const job = Q.jobs.find((j) => j.status === 'wait');
    if (!job) break;
    send(job);
  }
  renderQueue();
}

function send(job) {
  Q.active++;
  job.status = 'up';
  job.started = performance.now();
  const x = new XMLHttpRequest();
  job.xhr = x;
  x.open('PUT', '/api/upload?path=' + enc(job.dir) + '&name=' + enc(job.name));
  x.setRequestHeader('Content-Type', 'application/octet-stream');
  x.upload.onprogress = (e) => { job.loaded = e.loaded; scheduleQueue(); };
  x.onload = () => {
    let data = {};
    try { data = JSON.parse(x.responseText); } catch (e) { /* not JSON */ }
    if (x.status === 200) {
      job.status = 'done';
      job.loaded = job.file.size;
      job.saved = data.name;
    } else {
      job.status = 'err';
      job.error = data.error || 'Error ' + x.status;
      if (x.status === 401) showLogin();
    }
    finish(job);
  };
  x.onerror = () => { job.status = 'err'; job.error = 'Connection lost'; finish(job); };
  x.onabort = () => { job.status = 'cancel'; finish(job); };
  x.send(job.file);
}

function finish(job) {
  Q.active--;
  job.xhr = null;
  job.ended = performance.now();
  if (job.status === 'done' && S.dir && job.dir === S.dir.path) refreshSoon();
  if (!Q.jobs.some((j) => j.status === 'wait' || j.status === 'up')) {
    const fresh = Q.jobs.filter((j) => !j.reported);
    fresh.forEach((j) => { j.reported = true; });
    const done = fresh.filter((j) => j.status === 'done').length;
    const failed = fresh.filter((j) => j.status === 'err').length;
    if (failed) toast(done + ' sent, ' + failed + ' failed', true);
    else if (done) toast(done === 1 ? 'Sent to the phone' : done + ' files sent to the phone');
  }
  pump();
}

function cancelJob(job) {
  if (job.status === 'up') job.xhr.abort();
  else if (job.status === 'wait') { job.status = 'cancel'; renderQueue(); }
}

let queueFrame = 0;
function scheduleQueue() {
  if (queueFrame) return;
  queueFrame = requestAnimationFrame(() => { queueFrame = 0; renderQueue(); });
}

function renderQueue() {
  const box = $('#queue');
  const jobs = Q.jobs.filter((j) => j.status !== 'cancel');
  if (!jobs.length) { box.hidden = true; return; }
  box.hidden = false;
  box.classList.toggle('collapsed', Q.collapsed);

  const running = jobs.filter((j) => j.status === 'up');
  const waiting = jobs.filter((j) => j.status === 'wait');
  const done = jobs.filter((j) => j.status === 'done');
  const failed = jobs.filter((j) => j.status === 'err');
  const total = jobs.reduce((a, j) => a + j.file.size, 0);
  const loaded = jobs.reduce((a, j) => a + j.loaded, 0);
  const now = performance.now();
  const speed = running.reduce((a, j) => a + j.loaded / Math.max(0.001, (now - j.started) / 1000), 0);
  const busy = running.length + waiting.length > 0;

  $('#qTitle').textContent = busy
    ? 'Sending to phone · ' + (total ? Math.floor(loaded * 100 / total) : 0) + '%'
    : failed.length ? 'Finished with errors' : 'All files sent';
  $('#qSub').textContent = done.length + ' of ' + jobs.length + ' files · ' + fmtSize(loaded) + ' of ' + fmtSize(total) +
    (busy && speed ? ' · ' + fmtSize(speed) + '/s' : '');
  $('#qBar').style.width = (total ? loaded * 100 / total : 100) + '%';
  $('#qClose').title = busy ? 'Cancel all' : 'Close';

  const list = $('#qList');
  list.replaceChildren();
  // Long folder uploads: show what matters, not thousands of rows
  const rows = [...running, ...failed, ...waiting.slice(0, 20), ...done.slice(-20).reverse()];
  rows.forEach((job) => {
    const row = el('div', 'qrow');
    row.appendChild(el('div', 'qname', job.name));
    if (job.status === 'up') {
      const bar = el('div', 'bar');
      const fill = el('i');
      fill.style.width = (job.file.size ? job.loaded * 100 / job.file.size : 0) + '%';
      bar.appendChild(fill);
      row.appendChild(bar);
    }
    const info = {
      up: () => fmtSize(job.loaded) + ' of ' + fmtSize(job.file.size),
      wait: () => 'Waiting · ' + fmtSize(job.file.size),
      done: () => (job.saved && job.saved !== job.name.split('/').pop() ? 'Saved as ' + job.saved : 'Sent') + ' · ' + fmtSize(job.file.size),
      err: () => job.error,
    }[job.status]();
    row.appendChild(el('div', 'qinfo' + (job.status === 'err' ? ' err' : job.status === 'done' ? ' ok' : ''), info));
    if (job.status === 'up' || job.status === 'wait') {
      const cancel = el('button');
      cancel.title = 'Cancel';
      cancel.appendChild(icon('x', 'sm'));
      cancel.onclick = () => cancelJob(job);
      row.appendChild(cancel);
    }
    list.appendChild(row);
  });
  const hidden = jobs.length - rows.length;
  if (hidden > 0) list.appendChild(el('div', 'qmore', '+ ' + hidden + ' more'));
}

$('#qToggle').onclick = () => { Q.collapsed = !Q.collapsed; renderQueue(); };
$('#qClose').onclick = () => {
  const busy = Q.jobs.some((j) => j.status === 'wait' || j.status === 'up');
  if (busy) Q.jobs.forEach(cancelJob);
  else { Q.jobs = []; renderQueue(); }
};

window.addEventListener('beforeunload', (e) => {
  if (Q.jobs.some((j) => j.status === 'wait' || j.status === 'up')) { e.preventDefault(); e.returnValue = ''; }
});

// File pickers
$('#btnUpload').onclick = () => { if (canWrite()) $('#pickFiles').click(); };
$('#btnUploadDir').onclick = () => { if (canWrite()) $('#pickDir').click(); };
$('#pickFiles').onchange = (e) => {
  enqueue([...e.target.files].map((f) => ({ file: f, rel: f.name })), S.dir.path);
  e.target.value = '';
};
$('#pickDir').onchange = (e) => {
  enqueue([...e.target.files].map((f) => ({ file: f, rel: f.webkitRelativePath || f.name })), S.dir.path);
  e.target.value = '';
};

// Drag and drop, including whole folders
let dragDepth = 0;
const hasFiles = (e) => e.dataTransfer && [...e.dataTransfer.types].includes('Files');

window.addEventListener('dragenter', (e) => {
  if (!hasFiles(e) || $('#app').hidden || !S.dir) return;
  e.preventDefault();
  dragDepth++;
  $('#dropTarget').textContent = S.dir.name;
  $('#drop').hidden = false;
});
window.addEventListener('dragover', (e) => {
  if (!hasFiles(e)) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'copy';
});
window.addEventListener('dragleave', (e) => {
  if (!hasFiles(e)) return;
  dragDepth = Math.max(0, dragDepth - 1);
  if (!dragDepth) $('#drop').hidden = true;
});
window.addEventListener('drop', async (e) => {
  if (!hasFiles(e)) return;
  e.preventDefault();
  dragDepth = 0;
  $('#drop').hidden = true;
  if (!S.dir || $('#app').hidden) return;
  const dir = S.dir.path;
  // Entries must be read during the event; the files are collected afterwards
  const entries = [...(e.dataTransfer.items || [])].map((i) => (i.webkitGetAsEntry ? i.webkitGetAsEntry() : null));
  const plain = [...e.dataTransfer.files];
  let files = [];
  if (entries.length && entries.every(Boolean)) {
    for (const entry of entries) await walk(entry, '', files);
  } else {
    files = plain.map((f) => ({ file: f, rel: f.name }));
  }
  enqueue(files, dir);
});

async function walk(entry, prefix, out) {
  try {
    if (entry.isFile) {
      const file = await new Promise((resolve, reject) => entry.file(resolve, reject));
      out.push({ file, rel: prefix + file.name });
    } else if (entry.isDirectory) {
      const reader = entry.createReader();
      for (;;) {
        const batch = await new Promise((resolve, reject) => reader.readEntries(resolve, reject));
        if (!batch.length) break;
        for (const child of batch) await walk(child, prefix + entry.name + '/', out);
      }
    }
  } catch (err) {
    toast("Couldn't read " + entry.name, true);
  }
}

// ---------------------------------------------------------------------------
// Toolbar and keyboard
// ---------------------------------------------------------------------------

$('#btnUp').onclick = () => { if (S.dir && S.dir.parent) navigate(S.dir.parent); };
$('#btnRefresh').onclick = () => { if (S.dir) load(S.dir.path); };
$('#btnView').onclick = () => {
  S.view = S.view === 'grid' ? 'list' : 'grid';
  store.set('view', S.view);
  renderList();
  renderSelection();
};
$('#sort').onchange = (e) => { S.sort = e.target.value; store.set('sort', S.sort); renderList(); renderSelection(); };
$('#showHidden').onchange = (e) => { S.hidden = e.target.checked; store.set('hidden', S.hidden ? '1' : '0'); renderList(); renderSelection(); };
$('#filter').oninput = (e) => { S.filter = e.target.value.trim(); renderList(); renderSelection(); };

document.addEventListener('keydown', (e) => {
  if (!$('#dialog').hidden) { if (e.key === 'Escape') $('#dCancel').click(); return; }
  if (!$('#viewer').hidden) {
    if (e.key === 'Escape') closeViewer();
    else if (e.key === 'ArrowLeft') stepMedia(-1);
    else if (e.key === 'ArrowRight') stepMedia(1);
    return;
  }
  if ($('#app').hidden || !S.dir) return;
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if (typing) { if (e.key === 'Escape') document.activeElement.blur(); return; }
  if (e.key === 'Delete' && S.sel.size) { e.preventDefault(); deleteSelected(); }
  else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'a') { e.preventDefault(); selectAll(); }
  else if (e.key === 'Escape' && S.sel.size) clearSelection();
  else if (e.key === 'Backspace' && S.dir.parent) { e.preventDefault(); navigate(S.dir.parent); }
  else if (e.key === 'F2' && S.sel.size === 1) { e.preventDefault(); renameSelected(); }
});

// Keep the phone's "connected" status and free space fresh
setInterval(async () => {
  if (document.hidden || $('#app').hidden) return;
  try {
    S.info = await api('/api/info');
    const v = S.info.volumes.find((x) => S.dir && x.path === S.dir.root);
    if (v) { S.dir.free = v.free; S.dir.total = v.total; renderStorage(); }
  } catch (e) { /* the offline banner explains it */ }
}, 15000);

document.addEventListener('visibilitychange', () => {
  if (!document.hidden && S.dir && !$('#app').hidden) load(S.dir.path);
});

start();
</script>
